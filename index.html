<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b7285">
<title>TNPSC குரூப் 4 — பயிற்சி</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261021a">
</head>
<body>
<div id="app">
  <header class="app-header">
    <h1>TNPSC குரூப் 4</h1>
    <p class="tagline" data-en="Exam practice · 2027">தேர்வுப் பயிற்சி · 2027</p>
    <div class="lang-toggle" id="lang-top" title="மொழி / Language (Part A Tamil questions always stay in Tamil)">
      <button data-lang="ta">த</button><button data-lang="en">En</button>
    </div>
  </header>

  <main id="home" class="screen active">
    <!-- Resume banner (shown only if an unfinished test exists) -->
    <div id="resume-banner" style="display:none"></div>

    <div class="mode-grid">
      <button class="mode-card" data-mode="learn">
        <span class="mode-icon">📖</span>
        <span class="mode-title" data-en="Study time">படிப்பு நேரம்</span>
        <span class="mode-sub" data-en="Syllabus topics · flashcards with examples">பாடத்திட்டத் தலைப்புகள் · எடுத்துக்காட்டுடன் நினைவு அட்டைகள்</span>
      </button>
      <button class="mode-card" data-mode="study">
        <span class="mode-icon">📚</span>
        <span class="mode-title" data-en="Study mode">படிப்பு முறை</span>
        <span class="mode-sub" data-en="Topic-wise · instant explanation">தலைப்பு வாரியாக · உடனடி விளக்கம்</span>
      </button>
      <button class="mode-card" data-mode="quick">
        <span class="mode-icon">⚡</span>
        <span class="mode-title" data-en="Quick test">விரைவுத் தேர்வு</span>
        <span class="mode-sub" data-en="25 questions · 22½ minutes · 37.5 marks">25 வினாக்கள் · 22½ நிமிடம் · 37.5 மதிப்பெண்</span>
      </button>
      <button class="mode-card" data-mode="full">
        <span class="mode-icon">📝</span>
        <span class="mode-title" data-en="Full test">முழுத் தேர்வு</span>
        <span class="mode-sub" data-en="200 questions · 3 hours · 300 marks">200 வினாக்கள் · 3 மணி நேரம் · 300 மதிப்பெண்</span>
      </button>
    </div>

    <!-- Review row -->
    <div class="review-grid">
      <button class="review-card" id="review-wrong">
        <span class="rev-icon">🔁</span>
        <span class="rev-title" data-en="Practise mistakes">தவறுகள் மீள்பார்வை</span>
        <span class="rev-count"><span id="review-wrong-count">0</span> <span data-en="questions">வினா</span></span>
      </button>
      <button class="review-card" id="review-marks">
        <span class="rev-icon">★</span>
        <span class="rev-title" data-en="Bookmarks">அடையாளமிட்டவை</span>
        <span class="rev-count"><span id="review-mark-count">0</span> <span data-en="questions">வினா</span></span>
      </button>
    </div>

    <!-- Weak-area dashboard (shown once there are stats) -->
    <section id="dashboard" class="dashboard"></section>

    <section class="history-section">
      <h2 data-en="📊 Previous scores">📊 முந்தைய மதிப்பெண்கள்</h2>
      <div id="history-list" class="history-list">
        </div>
    </section>
  </main>

  <!-- Study: topic picker -->
  <section id="topic-picker" class="screen">
    <button class="back-btn" data-back="home" data-en="← Home">← முகப்பு</button>
    <h2 data-en="Choose a topic">தலைப்பைத் தேர்ந்தெடுக்கவும்</h2>
    <div id="topic-list" class="topic-list"></div>
  </section>

  <!-- Study time: syllabus topics -->
  <section id="learn-topics" class="screen">
    <button class="back-btn" data-back="home" data-en="← Home">← முகப்பு</button>
    <h2 data-en="Study time">படிப்பு நேரம்</h2>
    <p class="learn-intro" data-en="Topics follow the official syllabus (Annexure III). Pick one to study its flashcards.">தலைப்புகள் அதிகாரப்பூர்வப் பாடத்திட்டப்படி (இணைப்பு III) அமைந்துள்ளன. ஒரு தலைப்பைத் தேர்ந்தெடுத்து நினைவு அட்டைகளைப் படிக்கவும்.</p>
    <div id="learn-list" class="topic-list"></div>
  </section>

  <!-- Study time: flashcards -->
  <section id="learn-cards" class="screen">
    <div class="quiz-topbar">
      <button class="back-btn" id="learn-back" data-en="← Topics">← தலைப்புகள்</button>
      <div class="progress-wrap"><div id="fc-progress" class="progress-bar"></div></div>
      <span id="fc-counter" class="q-counter"></span>
    </div>
    <div id="fc-meta" class="q-meta"></div>
    <div id="fc-card" class="fc-card" role="button" tabindex="0"></div>
    <div class="quiz-footer">
      <button class="btn-ghost" id="fc-prev"></button>
      <button class="btn-primary" id="fc-next"></button>
    </div>
  </section>

  <!-- Quiz runner -->
  <section id="quiz" class="screen">
    <div class="quiz-topbar">
      <button class="back-btn" id="quiz-exit" data-en="← Exit">← வெளியேறு</button>
      <div class="progress-wrap"><div id="progress-bar" class="progress-bar"></div></div>
      <span id="timer" class="timer" style="display:none"></span>
      <span id="q-counter" class="q-counter">1 / 25</span>
    </div>
    <div id="question-area" class="question-area"></div>
    <div id="quiz-footer" class="quiz-footer"></div>
  </section>

  <!-- Score -->
  <section id="score" class="screen">
    <div id="score-card" class="score-card"></div>
    <div id="explanations" class="explanations"></div>
    <div class="score-actions">
      <button class="btn-ghost" id="back-topics" style="display:none" data-en="📚 Topics">📚 தலைப்புகள்</button>
      <button class="btn-primary" data-back="home" data-en="🏠 Home">🏠 முகப்பு</button>
    </div>
  </section>
</div>

<script src="js/config.js?v=20261021a"></script>
<script src="js/storage.js?v=20261021a"></script>
<script src="js/quiz.js?v=20261021a"></script>
<script src="js/app.js?v=20261021a"></script>
</body>
</html>
